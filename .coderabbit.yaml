reviews:
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    base_branches:
      - main
      - develop
  path_instructions:
    - path: "frontend/**/*"
      instructions: "This frontend uses JavaScript and JSX, not TypeScript; do not flag missing TypeScript types. Flag async/await without try-catch as MEDIUM. Check React component structure and missing prop validation."
